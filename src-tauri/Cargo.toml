[package]
name = "argus"
version = "0.10.0"
description = "A quiet place for Markdown"
authors = ["wylycool"]
license = "MIT"
repository = "https://github.com/wylycool/argus"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
tempfile = "3"
xattr = "1"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSPrintInfo", "NSPrintOperation", "NSWindow"] }

[features]
# Required by the Tauri CLI for a self-contained production application.
custom-protocol = ["tauri/custom-protocol"]
